name: STUNMAP — Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update GitHub Releases

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create placeholder GeoLite2 DB
        # Real mmdb must be added by the developer — see CLOUD.md.
        # Empty placeholder lets the build succeed; offline geo is
        # gracefully disabled at runtime.
        run: touch app/src/main/assets/GeoLite2-City.mmdb

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STUNMAP-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK info
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          echo "Size:   $(du -sh $apk | cut -f1)"
          echo "SHA256: $(sha256sum $apk | cut -d' ' -f1)"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="STUNMAP-debug-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"

          # Remove the old rolling release/tag if it exists
          gh release delete latest-debug --yes 2>/dev/null || true
          git push origin :refs/tags/latest-debug 2>/dev/null || true

          gh release create latest-debug \
            --title "STUNMAP Debug APK — latest (${SHORT_SHA})" \
            --notes "**Auto-built debug APK** from commit [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

          > [!WARNING]
          > This is an unsigned **debug** build for evaluation and testing only.
          > For offline IP geolocation add your own \`GeoLite2-City.mmdb\` — see [CLOUD.md](https://github.com/${{ github.repository }}/blob/main/CLOUD.md)." \
            --prerelease \
            "${APK_NAME}"
