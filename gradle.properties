# Project-wide Gradle settings.

# AndroidX package structure, required for Compose and all modern AndroidX libs.
android.useAndroidX=true

# Enables R8 full mode in release builds for better shrinking.
android.enableR8.fullMode=true

# Kotlin code style
kotlin.code.style=official

# Increases the heap size for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables parallel build execution.
org.gradle.parallel=true

# Enables Gradle configuration cache (speeds up builds).
org.gradle.configuration-cache=true

# Enable KSP incremental processing
ksp.incremental=true
